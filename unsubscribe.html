<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoonTax · 退订 / Unsubscribe</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#06100d; --bg2:#0a1814; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#eef5f1; --mute:#93a7a0; --dim:#647871;
  --mint:#5fe3b1; --mint2:#2fbf8c; --gold:#e9c47c; --rust:#ff8a6b;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}

/* ---------- background ---------- */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:720px;height:720px;left:-180px;top:-260px;background:radial-gradient(circle,#0f7a58 0%,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:620px;height:620px;right:-160px;top:-120px;background:radial-gradient(circle,#1a4f7a 0%,transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:520px;height:520px;left:38%;top:260px;background:radial-gradient(circle,#6b5420 0%,transparent 68%);opacity:.35;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(160px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-140px,180px) scale(.9)}}
@keyframes drift3{to{transform:translate(-200px,-60px) scale(1.2)}}
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);opacity:.55}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);background:rgba(6,16,13,.55);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:none}
.brand svg{width:30px;height:30px}
.navlinks{display:flex;gap:26px;align-items:center;font-size:14.5px;color:var(--mute)}
.navlinks a{text-decoration:none;transition:color .2s}
.navlinks a:hover{color:var(--text)}
@media(max-width:720px){.navlinks a.hide-m{display:none}}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;justify-content:center;border:0;cursor:pointer;font:inherit;font-weight:650;font-size:15.5px;text-decoration:none;color:#04110c;
  background:linear-gradient(135deg,var(--mint),#9ff2cf);padding:14px 22px;border-radius:12px;box-shadow:0 0 0 1px rgba(95,227,177,.4),0 10px 30px -10px rgba(95,227,177,.55);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(95,227,177,.6),0 14px 40px -10px rgba(95,227,177,.75)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.sm{padding:9px 15px;font-size:14px;border-radius:10px}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:600;font-size:15.5px;padding:13px 20px;border-radius:12px;border:1px solid var(--line2);background:var(--glass);transition:background .2s}
.btn-ghost:hover{background:var(--glass2)}

/* ---------- type ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor;opacity:.7}
h1{font-size:clamp(38px,6vw,68px);line-height:1.08;letter-spacing:-.025em;margin:18px 0 22px;font-weight:800}
h1 .grad{background:linear-gradient(100deg,#fff 10%,var(--mint) 55%,var(--gold) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,3.6vw,42px);line-height:1.15;letter-spacing:-.02em;margin:14px 0 14px;font-weight:780}
h3{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:18px;color:var(--mute);max-width:600px}
.mute{color:var(--mute)}
section{padding:110px 0}
.sec-head{max-width:720px;margin-bottom:46px}

/* ---------- glass ---------- */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line2);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

/* ---------- hero ---------- */
.hero{padding:88px 0 70px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
@media(max-width:960px){.hero .wrap{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);font-size:13.5px;color:var(--mute)}
.pill b{background:rgba(95,227,177,.14);color:var(--mint);font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.trust{display:flex;flex-wrap:wrap;gap:18px;margin-top:30px;font-size:13.5px;color:var(--mute)}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust svg{width:16px;height:16px;color:var(--mint)}

/* report card */
.report{position:relative;padding:22px;transform:perspective(1400px) rotateY(-6deg) rotateX(3deg);transition:transform .6s}
.report:hover{transform:perspective(1400px) rotateY(0) rotateX(0)}
.report::before{content:"";position:absolute;inset:-1px;border-radius:var(--r);padding:1px;background:linear-gradient(140deg,rgba(95,227,177,.6),transparent 40%,transparent 60%,rgba(233,196,124,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.report-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:3px 8px;border-radius:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{padding:14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.kpi small{display:block;font-size:11.5px;color:var(--mute);margin-bottom:4px}
.kpi strong{font-size:24px;letter-spacing:-.02em}
.kpi.warn strong{color:var(--rust)}
.spark{height:54px;margin:4px 0 12px}
.rows{font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid var(--line);opacity:0;transform:translateY(8px);animation:rowin .6s forwards}
.row:nth-child(1){animation-delay:.5s}.row:nth-child(2){animation-delay:.8s}.row:nth-child(3){animation-delay:1.1s}.row:nth-child(4){animation-delay:1.4s}
@keyframes rowin{to{opacity:1;transform:none}}
.row em{font-style:normal;color:var(--dim);margin-left:6px}
.row .pos{color:var(--mint);font-weight:650}
.row .neg{color:var(--rust);font-weight:650}
.scan{position:absolute;left:0;right:0;height:60px;top:0;background:linear-gradient(180deg,transparent,rgba(95,227,177,.10),transparent);animation:scan 4.5s ease-in-out infinite;pointer-events:none;border-radius:var(--r)}
@keyframes scan{0%{top:0}50%{top:calc(100% - 60px)}100%{top:0}}
.note{font-size:11.5px;color:var(--dim);margin-top:10px}

/* brokers strip */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.strip .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 34px;padding:22px 28px;font-size:14px;color:var(--mute)}
.strip b{color:var(--text);font-weight:650;letter-spacing:.01em}
.strip .soon{color:var(--dim)}

/* pain */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:900px){.cards3{grid-template-columns:1fr}}
.pain{padding:28px;position:relative;overflow:hidden}
.pain .n{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.06em}
.pain h3{margin-top:14px;font-size:19px}
.pain p{color:var(--mute);font-size:15px}
.pain .glow{position:absolute;width:200px;height:200px;border-radius:50%;right:-80px;top:-80px;background:radial-gradient(circle,rgba(95,227,177,.18),transparent 70%)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative}
@media(max-width:900px){.steps{grid-template-columns:1fr}}
.step{padding:28px}
.step .num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#04110c;background:linear-gradient(135deg,var(--mint),#9ff2cf);margin-bottom:18px}
.step p{color:var(--mute);font-size:15px}
.include{margin-top:18px;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 28px}
@media(max-width:900px){.include{grid-template-columns:1fr}}
.include div{display:flex;gap:10px;font-size:15px;color:#d6e3dd}
.include svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--mint)}

/* compare */
.tablebox{overflow-x:auto;padding:6px}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:14.5px}
th,td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.04em}
td:first-child{color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.col-us{background:rgba(95,227,177,.07);color:var(--text);font-weight:650}
th.col-us{color:var(--mint)}

/* pricing */
.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:860px}
@media(max-width:760px){.prices{grid-template-columns:1fr}}
.price{padding:32px;position:relative}
.price.hot{border-color:rgba(95,227,177,.45);box-shadow:0 30px 80px -40px rgba(95,227,177,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.price .badge{position:absolute;top:22px;right:22px;font-size:12px;font-weight:700;color:#04110c;background:var(--gold);padding:4px 10px;border-radius:999px}
.amount{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:14px 0 2px}
.amount small{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0}
.price ul{list-style:none;padding:0;margin:20px 0 26px;display:grid;gap:10px;font-size:15px;color:#d6e3dd}
.price li{display:flex;gap:10px}
.price li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-top:10px}

/* form */
.join{position:relative}
.join-box{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;padding:48px;align-items:start;overflow:hidden;position:relative}
@media(max-width:900px){.join-box{grid-template-columns:1fr;padding:28px}}
.join-box::after{content:"";position:absolute;width:520px;height:520px;left:-200px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(95,227,177,.22),transparent 65%);pointer-events:none}
form{display:grid;gap:22px;position:relative;z-index:1}
.lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:10px}
input[type=email]{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--text);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
input[type=email]::placeholder{color:var(--dim)}
input[type=email]:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 4px rgba(95,227,177,.15)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:14.5px;color:#d6e3dd;transition:all .18s;cursor:pointer;user-select:none}
.chip input:hover+span{border-color:rgba(255,255,255,.3)}
.chip input:checked+span{background:rgba(95,227,177,.16);border-color:var(--mint);color:#fff}
.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(95,227,177,.35)}
.pro{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px dashed var(--line2);border-radius:12px;font-size:14.5px;cursor:pointer;color:#d6e3dd}
.pro input{flex:none;width:18px;height:18px;accent-color:var(--mint)}
.consent{border-style:solid;align-items:flex-start;font-size:13.5px;color:var(--mute)}
.consent input{margin-top:2px}
.consent a{color:var(--mint)}
.err{display:none;color:var(--rust);font-size:14px}
.fine{font-size:13px;color:var(--dim);text-align:center}
.done{display:none;position:relative;z-index:1;padding:20px 0}
.done .ok{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(95,227,177,.15);color:var(--mint);margin-bottom:18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* faq */
.faq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:860px){.faq{grid-template-columns:1fr}}
details{padding:0;border-radius:14px}
summary{list-style:none;cursor:pointer;padding:20px 22px;font-weight:650;font-size:16px;display:flex;justify-content:space-between;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;font-weight:400;color:var(--mint);transition:transform .25s;line-height:1}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 22px 20px;color:var(--mute);font-size:15px}

footer{border-top:1px solid var(--line);padding:36px 0 48px;font-size:13px;color:var(--dim)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
footer p{max-width:720px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.row{opacity:1;transform:none}.report{transform:none}}

.doc{max-width:760px;margin:0 auto;padding:70px 28px 90px}
.doc h1{font-size:clamp(30px,4vw,42px);margin:10px 0 8px}
.doc h2{font-size:22px;margin:38px 0 10px}
.doc p,.doc li{color:#c9d8d2;font-size:15.5px;line-height:1.8}
.doc ul{padding-left:20px}
.doc a{color:var(--mint)}
.sep{border:0;border-top:1px solid var(--line2);margin:70px 0 40px}
.box{padding:28px;margin-top:22px}
textarea,select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--text);font:inherit;font-size:15.5px}
textarea{min-height:150px;resize:vertical}
textarea:focus,select:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 4px rgba(95,227,177,.15)}
select option{background:#0a1814}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grid-bg" aria-hidden="true"></div>
<nav><div class="wrap"><a class="brand" href="/"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true" style="width:28px;height:28px"><rect width="32" height="32" rx="9" fill="#5fe3b1"/><path d="M7 19.5c3.2 0 4.6-5.5 9-5.5 2.6 0 3.6 1.6 5.4 1.6 1.4 0 2.4-.9 3.6-2.1-.4 3.6-2.6 6-5.6 6-2.8 0-3.6-1.4-5.2-1.4-2.4 0-3.8 1.4-7.2 1.4Z" fill="#04110c"/><circle cx="22.6" cy="12.2" r="1.3" fill="#04110c"/></svg>LoonTax</a>
<div class="navlinks"><a href="/">中文</a><a href="/en/" lang="en">EN</a></div></div></nav>
<main class="doc">
<h1>退订 <span class="mute" lang="en" style="font-weight:500">/ Unsubscribe</span></h1>
<p>输入你登记时用的邮箱，我们就不再给它发任何邮件。<br><span lang="en">Enter the email you signed up with and we'll stop emailing it.</span></p>
<div class="glass box" id="en">
<form id="u-form" novalidate style="display:grid;gap:14px">
<label class="lbl" for="u-email">邮箱 / Email</label>
<input id="u-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
<button id="u-btn" class="btn" type="submit">退订 / Unsubscribe</button>
</form>
<p id="u-msg" role="status" style="margin-top:14px"></p>
</div>
<p style="margin-top:22px">想彻底删除你的登记信息？用<a href="/contact">联系表单</a>告诉我们。<br><span lang="en">Want your entry deleted entirely? Use the <a href="/contact#en">contact form</a>.</span></p>
</main>
<script>
(function(){
  var f=document.getElementById('u-form'),msg=document.getElementById('u-msg'),btn=document.getElementById('u-btn');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var email=f.email.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent='请填写有效的邮箱地址 / Please enter a valid email.';return;}
    btn.disabled=true;
    fetch("https://bmvoqeriqhcaxweuqjdz.supabase.co/rest/v1/rpc/unsubscribe",{method:'POST',headers:{'apikey':"sb_publishable_qDk-n67dGD4P5DmA4yQZ2g_653PbTlw",'Content-Type':'application/json'},body:JSON.stringify({p_email:email})})
    .then(function(r){ if(!r.ok) throw 0; f.style.display='none'; msg.textContent='已处理：如果这个邮箱在名单里，我们不会再给它发邮件。/ Done: if this email was on the list, we won\'t email it again.'; })
    .catch(function(){ btn.disabled=false; msg.textContent='出错了，请稍后再试，或用联系表单告诉我们。/ Something went wrong — try again or use the contact form.'; });
  });
  try{var q=new URLSearchParams(location.search).get('email'); if(q) f.email.value=q;}catch(_){}
})();
</script>
</body>
</html>
