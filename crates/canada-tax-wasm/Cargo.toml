[package]
name = "loontax-canada-tax-wasm"
version.workspace = true
edition.workspace = true
description = "LoonTax tax engine for the browser: one JSON in, one JSON report out"
license = "AGPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loontax-canada-tax = { path = "../canada-tax" }
# No default features: the engine never reads the clock, and chrono's
# default "wasmbind" would tie the WebAssembly build to JavaScript bindings.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
