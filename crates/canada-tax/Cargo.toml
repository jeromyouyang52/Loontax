[package]
name = "loontax-canada-tax"
version.workspace = true
edition.workspace = true
description = "Canadian tax ledger for LoonTax: adjusted cost base, registered-plan rules and their yearly rule table"
license = "AGPL-3.0"

[dependencies]
async-trait = { workspace = true }
# No default features: the engine never reads the clock, and chrono's
# default "wasmbind" would tie the WebAssembly build to JavaScript bindings.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
rust_decimal_macros = { workspace = true }

[lints]
workspace = true
