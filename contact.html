<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0f0e">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoonTax · 联系我们 / Contact</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
.doc{max-width:780px;margin:0 auto;padding:80px 40px 110px}
@media(max-width:760px){.doc{padding:56px 22px 80px}}
.doc h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,5vw,60px);line-height:1.1;margin:16px 0 18px}
.doc h2{font-size:26px;margin:44px 0 12px}
.doc p,.doc li{color:#cfcabf;font-size:15.5px;line-height:1.85}
.doc ul{padding-left:20px}
.doc a{color:var(--brass)}
.doc code{font-size:13px;color:var(--brass)}
.sep{border:0;border-top:1px solid var(--rule);margin:80px 0 50px}
.box{padding:32px;margin-top:26px}
.doc form{display:grid;gap:22px}
</style>
</head>
<body>
<div class="ledger" aria-hidden="true"></div><div class="light" aria-hidden="true"></div>
<nav><div class="wrap"><a class="brand" href="/"><i>L</i>LoonTax</a>
<div class="links"><a href="/" class="keep">中文</a><a href="/en/" class="keep" lang="en">EN</a></div></div></nav>
<main class="doc">
<h1>联系我们 <span class="mute" lang="en" style="font-weight:500">/ Contact</span></h1>
<p>问题、合作（报税师 / 会计事务所）、查看或删除你的数据，都可以在这里留言，我们会回复到你填写的邮箱。<br>
<span lang="en">Questions, partnerships (tax preparers / firms), or a request to see or delete your data — leave a message and we'll reply by email.</span></p>
<div class="glass box" id="en">
<form id="c-form" novalidate style="display:grid;gap:14px">
<label class="lbl" for="c-email">你的邮箱 / Your email</label>
<input id="c-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label class="lbl" for="c-topic">类型 / Topic</label>
<select id="c-topic" name="topic">
<option value="question">一般问题 / General question</option>
<option value="pro">报税师合作 / I'm a tax preparer</option>
<option value="delete">删除我的数据 / Delete my data</option>
<option value="correct">更正我的数据 / Correct my data</option>
<option value="refund">退款 / Refund</option>
<option value="other">其他 / Other</option>
</select>
<label class="lbl" for="c-msg-in">留言 / Message</label>
<textarea id="c-msg-in" name="message" maxlength="2000" required></textarea>
<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
<button id="c-btn" class="btn" type="submit">发送 / Send</button>
</form>
<p id="c-msg" role="status" style="margin-top:14px"></p>
</div>
</main>
<script>
(function(){
  var f=document.getElementById('c-form'),msg=document.getElementById('c-msg'),btn=document.getElementById('c-btn');
  var LIVE=/(^|\.)loontax\.vercel\.app$/.test(location.hostname);
  try{var t=new URLSearchParams(location.search).get('topic'); if(t) f.topic.value=t;}catch(_){}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(f.website.value) return;
    var email=f.email.value.trim(), m=f.message.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent='请填写有效的邮箱地址 / Please enter a valid email.';return;}
    if(!m){msg.textContent='请写下你的问题 / Please write a message.';return;}
    if(!LIVE){f.style.display='none';msg.textContent='预览模式，未发送 / Preview mode, not sent.';return;}
    btn.disabled=true;
    fetch("https://bmvoqeriqhcaxweuqjdz.supabase.co/rest/v1/contact_messages",{method:'POST',headers:{'apikey':"sb_publishable_qDk-n67dGD4P5DmA4yQZ2g_653PbTlw",'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({email:email,topic:f.topic.value,message:m.slice(0,2000),lang:/^en/.test(navigator.language||'')?'en':'zh'})})
    .then(function(r){ if(!r.ok) throw 0; f.style.display='none'; msg.textContent='收到了，我们会尽快回复到你的邮箱。/ Got it — we\'ll reply to your email soon.'; })
    .catch(function(){ btn.disabled=false; msg.textContent='发送失败，请稍后再试。/ Couldn\'t send — please try again.'; });
  });
})();
</script>
</body>
</html>
